name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project
        run: |
          flutter create app --project-name quran_kurdish --org com.quran.kurdish --platforms=android
          mkdir -p app/lib app/assets
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cp quran.json app/quran.json
          # prayer timetables (data file); an empty one if the repo has none
          if [ -f prayer_times.json ]; then cp prayer_times.json app/prayer_times.json; else echo '{"cities":{}}' > app/prayer_times.json; fi
          cp banner.jpg app/assets/banner.jpg
          rm -f app/test/widget_test.dart
          # optional adhan sound (notification channel 'adhan_sound_v1')
          if [ -f adhan.mp3 ]; then
            mkdir -p app/android/app/src/main/res/raw
            cp adhan.mp3 app/android/app/src/main/res/raw/adhan.mp3
          fi
          python3 patch_android.py app
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          mkdir -p assets/model
          touch /tmp/stamp
          dart run recite_quran:download_model || echo "model download failed"
          # copy whatever the downloader created into assets/model
          for f in $(find . "$HOME/.pub-cache/hosted" -type f -newer /tmp/stamp \
              -not -path './build/*' -not -path './.dart_tool/*' \
              \( -name '*.onnx' -o -name 'tokens*' \) 2>/dev/null); do
            case "$f" in ./assets/model/*) ;; *) cp "$f" assets/model/ ;; esac
          done
          ls -la assets/model
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Quran Kurdish APK
          files: app/build/app/outputs/flutter-apk/app-release.apk
