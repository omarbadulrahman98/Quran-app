name: Build APK
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project
        run: |
          flutter create app --project-name quran_kurdish --org com.quran.kurdish --platforms=android
          mkdir -p app/lib
          cp main.dart app/lib/main.dart
          cp pubspec.yaml app/pubspec.yaml
          cp quran.json app/quran.json
          rm -f app/test/widget_test.dart
          M=app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="Quran Kurdish"#' $M
      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Quran Kurdish APK
          files: app/build/app/outputs/flutter-apk/app-release.apk
